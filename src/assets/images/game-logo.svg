<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="title-logo-label">
	<style>
		@font-face {
	    font-family: 'Logo-a';
	    src: url('data:font/woff;base64,') format('woff');
		}
		@font-face {
	    font-family: 'Logo-b';
	    src: url('data:font/woff;base64,') format('woff');
		}
		.crescent{fill:none;stroke:url(#crescent-fill);stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 7px rgb(255 217 106/.46))}
		.kanji{font-family:Logo-a,Logo-b,serif;font-weight:400;fill:url(#logo-fill);stroke:rgb(94 34 20/.92);stroke-width:2.2;stroke-linejoin:round;paint-order:stroke fill;filter:drop-shadow(3px 4px 0 rgb(197 72 32/.48))}
		.song{font-size:150px}.moon{font-size:160px}.ten{font-size:110px}.night{font-size:110px}
		.rule{fill:none;stroke-width:2;stroke-linecap:round;filter:drop-shadow(0 0 6px rgb(255 217 106/.72))}
		.horizontal{stroke:url(#rule-fill)}.vertical{stroke:url(#rule-vertical-fill)}
		.latin{font-family:Arial,sans-serif;font-size:16px;font-weight:400;letter-spacing:.5px;fill:#5e2214;stroke:rgb(255 243 208/.86);stroke-width:4;paint-order:stroke fill}
		.flare path{fill:none;stroke:#fff3d0;stroke-linecap:round;stroke-width:1.5}.flare circle{fill:#fff3d0;filter:drop-shadow(0 0 8px #ffd96a)}
	</style>
	<defs>
		<linearGradient id="logo-fill" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fff3d0"/>
			<stop offset=".58" stop-color="#ffd96a"/>
			<stop offset="1" stop-color="#c54820"/>
		</linearGradient>
		<linearGradient id="crescent-fill" gradientUnits="userSpaceOnUse" x1="105" y1="115" x2="420" y2="415">
			<stop offset="0" stop-color="#fff3d0"/>
			<stop offset=".48" stop-color="#ffd96a"/>
			<stop offset="1" stop-color="#f2a629"/>
		</linearGradient>
		<linearGradient id="rule-fill" gradientUnits="userSpaceOnUse" x1="55" y1="250" x2="455" y2="250">
			<stop offset="0" stop-color="#fff3d0" stop-opacity="0"/>
			<stop offset=".15" stop-color="#fff3d0"/>
			<stop offset=".78" stop-color="#ffd96a"/>
			<stop offset="1" stop-color="#f2a629" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="rule-vertical-fill" gradientUnits="userSpaceOnUse" x1="354" y1="58" x2="354" y2="350">
			<stop offset="0" stop-color="#fff3d0" stop-opacity="0"/>
			<stop offset=".14" stop-color="#fff3d0"/>
			<stop offset=".66" stop-color="#ffd96a"/>
			<stop offset="1" stop-color="#f2a629" stop-opacity="0"/>
		</linearGradient>
	</defs>
	<g aria-hidden="true">
		<path class="crescent" d="M184 87A180 180 0 1 0 416 340"/>
		<path class="rule horizontal" d="M55 250H455"/>
		<path class="rule vertical" d="M354 58V350"/>
		<text class="kanji song" x="260" y="196" text-anchor="middle" lang="ja">歌</text>
		<text class="kanji moon" x="170" y="342" text-anchor="middle" lang="ja">月</text>
		<text class="kanji ten" x="260" y="344" text-anchor="middle" lang="ja">十</text>
		<text class="kanji night" x="260" y="451" text-anchor="middle" lang="ja">夜</text>
		<text class="latin" x="345" y="237" text-anchor="middle">kagetsu tohya</text>
		<g class="flare" transform="translate(354 250)">
			<path d="M-22 0H22M0-22V22"/>
			<path d="M-12-12L12 12M12-12L-12 12"/>
			<circle r="3.5"/>
		</g>
	</g>
</svg>
