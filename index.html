<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/webp" href="/icons/icon_32.webp" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#2b0d0c" />
		<meta name="description" content="Enjoy the fandisc story from 2001 in your browser." />
		<link rel="manifest" href="/manifest.json">
		<title>Kagetsu Tohya</title>

		<script>
			if (window.location.pathname === '/') {
				if (!sessionStorage.getItem('app_entry_path')) {
					sessionStorage.setItem('app_entry_path', '/');
					document.documentElement.dataset.preloading = 'disclaimer';
				}
			} else if (!sessionStorage.getItem('app_entry_path')) {
				sessionStorage.setItem('app_entry_path', window.location.pathname);
			}
		</script>
		<style>
			:root {
				--ui-font: "Ubuntu";
				--game-font: "Ubuntu";
			}
			* {
				box-sizing: border-box;
				-webkit-tap-highlight-color: transparent;
			}
			html {
				font-family: var(--ui-font, system-ui), Arial, sans-serif;
				font-size: 1.1rem;
				line-height: 1.5;
				font-weight: normal;

				color-scheme: light dark;
				color: #fff3d0;
				background-color: #160807;

				font-synthesis: none;
				text-rendering: optimizeLegibility;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
				-webkit-text-size-adjust: 100%;
			}
			body {
				margin: 0;
				display: flex;
				touch-action: manipulation;
			}
			#root {
				background:
					radial-gradient(circle at 20% 8%, #fff3d0 0%, #ffd96a 8%, transparent 27%),
					radial-gradient(ellipse at 50% 42%, #f2a629 0%, #c54820 28%, transparent 64%),
					linear-gradient(180deg, #ffd96a 0%, #c54820 28%, #5e2214 58%, #2b0d0c 78%, #160807 100%);
				height: 100vh;
				height: 100svh;
				width: 100vw;
				display: flex;
				align-items: center;
				justify-content: center;
				overflow: hidden;
				isolation: isolate;
				position: relative;
			}
			html[data-preloading='disclaimer'] #root {
				background: black !important;
			}
		</style>
	</head>
	<body>
		<noscript>You need to enable javascript to run this visual novel.</noscript>
		<div id="root"></div>
		<script type="module" src="/src/app/main.tsx"></script>
	</body>
</html>
